# Draws the contribution "snake" in the brand colours and publishes it to the
# `output` branch, where the README picks it up. Runs daily and on demand.
name: Contribution snake

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f4a640&color_dots=#1f1e1c,#5c2a14,#8a3512,#b0450e,#d63d1b
            dist/snake-light.svg?palette=github-light&color_snake=#d63d1b&color_dots=#ebe4d6,#f2c9a8,#e8945c,#c4541a,#8a3512

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
