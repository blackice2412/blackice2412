# Draws the contribution "snake" in the brand colours and publishes it to the
# `output` branch, where the README picks it up. Runs daily and on demand.
name: Contribution snake

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e8cf9e&color_dots=#172020,#0b4a49,#0d6867,#0f7e7d,#56c2bb
            dist/snake-light.svg?palette=github-light&color_snake=#0f7e7d&color_dots=#ebe6da,#b9e0dc,#6fc2bb,#1f9a96,#0d6867

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
